name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.9"
      - name: Configure isolated environment
        shell: bash
        run: printf 'UV_PROJECT_ENVIRONMENT=%s/yanzhang-venv\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked environment
        run: uv sync --frozen --all-extras
      - name: Audit source allowlist and credentials
        run: uv run python scripts/release_audit.py
      - name: Run network-isolated tests
        env:
          GONGWEN_DATA_DIR: ${{ runner.temp }}/gongwen-test-data
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,testserver
        run: uv run pytest -p no:cacheprovider
      - name: Run static checks
        run: |
          uv run ruff check --no-cache .
          uv run ruff format --check --no-cache .
          uv run mypy --cache-dir="${RUNNER_TEMP}/mypy-cache" gongwen_web gongwen_mcp yanzhang yanzhang_core yanzhang_academic
      - name: Remove generated test bytecode
        run: >-
          find gongwen_mcp gongwen_web yanzhang yanzhang_core yanzhang_academic tests scripts
          -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Build and audit release archives
        run: |
          uv build
          uv run python scripts/package_connector.py dist
          uv run python scripts/release_audit.py --artifacts dist
          uv run python scripts/write_checksums.py dist
      - name: Upload reviewed archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yanzhang-gongwen-preview
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/yanzhang-workbuddy-connector-*.zip
          if-no-files-found: error
          retention-days: 14
