name: ${GONGWEN_COMPOSE_PROJECT:-gongwen-web}

services:
  gongwen:
    build:
      context: ../..
      dockerfile: deploy/gongwen/Dockerfile
    image: ${GONGWEN_IMAGE:-gongwen-web:local}
    restart: unless-stopped
    init: true
    environment:
      GONGWEN_ENV: production
      GONGWEN_HOST: 0.0.0.0
      GONGWEN_PORT: 8787
      GONGWEN_WORKERS: 1
      GONGWEN_ACCESS_LOG: ${GONGWEN_ACCESS_LOG:-false}
      GONGWEN_DATA_DIR: /var/lib/gongwen
      GONGWEN_ACCESS_TOKEN: ${GONGWEN_ACCESS_TOKEN:-CHANGE_ME_WITH_AT_LEAST_32_RANDOM_CHARACTERS}
      GONGWEN_MCP_ACCESS_TOKEN: ${GONGWEN_MCP_ACCESS_TOKEN:-CHANGE_ME_WITH_AN_INDEPENDENT_32_BYTE_RANDOM_TOKEN}
      GONGWEN_ALLOWED_HOSTS: ${GONGWEN_ALLOWED_HOSTS:-127.0.0.1,localhost,[::1]}
      GONGWEN_CORS_ORIGINS: ${GONGWEN_CORS_ORIGINS:-}
      GONGWEN_TRUSTED_PROXY_IPS: ${GONGWEN_NETWORK_SUBNET:-172.30.88.0/24}
      GONGWEN_MAX_REQUEST_BYTES: ${GONGWEN_MAX_REQUEST_BYTES:-2097152}
      GONGWEN_RATE_LIMIT_REQUESTS: ${GONGWEN_RATE_LIMIT_REQUESTS:-120}
      GONGWEN_RATE_LIMIT_WINDOW_SECONDS: ${GONGWEN_RATE_LIMIT_WINDOW_SECONDS:-60}
      GONGWEN_HSTS_SECONDS: ${GONGWEN_HSTS_SECONDS:-31536000}
      GONGWEN_ENABLE_INSECURE_PEOPLE_SEARCH: ${GONGWEN_ENABLE_INSECURE_PEOPLE_SEARCH:-false}
      GONGWEN_LLM_PROVIDER: ${GONGWEN_LLM_PROVIDER:-}
      GONGWEN_LLM_MODEL: ${GONGWEN_LLM_MODEL:-}
      GONGWEN_LLM_API_KEY: ${GONGWEN_LLM_API_KEY:-}
      GONGWEN_LLM_BASE_URL: ${GONGWEN_LLM_BASE_URL:-}
      GONGWEN_LLM_TIMEOUT_SECONDS: ${GONGWEN_LLM_TIMEOUT_SECONDS:-}
      GONGWEN_CLIENT_LLM_BASE_URL_ALLOWLIST: ${GONGWEN_CLIENT_LLM_BASE_URL_ALLOWLIST:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - gongwen-data:/var/lib/gongwen
    expose:
      - "8787"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8787/api/ready', timeout=3));
          assert data.get('ok') is True
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${GONGWEN_LOG_MAX_SIZE:-10m}
        max-file: ${GONGWEN_LOG_MAX_FILES:-3}
    networks:
      - web

  proxy:
    image: ${GONGWEN_CADDY_IMAGE:-caddy:2.10-alpine}
    restart: unless-stopped
    depends_on:
      gongwen:
        condition: service_healthy
    environment:
      GONGWEN_SITE_ADDRESS: ${GONGWEN_SITE_ADDRESS:-:80}
      GONGWEN_PROXY_MAX_REQUEST_SIZE: ${GONGWEN_PROXY_MAX_REQUEST_SIZE:-2MB}
      # Docker Desktop may inject a host HTTP proxy into every container. Keep
      # service-to-service traffic on the private Compose network instead.
      NO_PROXY: gongwen,localhost,127.0.0.1,::1
      no_proxy: gongwen,localhost,127.0.0.1,::1
    ports:
      - "${GONGWEN_BIND_ADDRESS:-127.0.0.1}:${GONGWEN_HTTP_PORT:-8080}:80"
      - "${GONGWEN_BIND_ADDRESS:-127.0.0.1}:${GONGWEN_HTTPS_PORT:-8443}:443"
      - "${GONGWEN_BIND_ADDRESS:-127.0.0.1}:${GONGWEN_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        - CMD
        - wget
        - -Y
        - "off"
        - -q
        - -T
        - "3"
        - -O
        - /dev/null
        - http://127.0.0.1:2019/api/ready
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${GONGWEN_LOG_MAX_SIZE:-10m}
        max-file: ${GONGWEN_LOG_MAX_FILES:-3}
    networks:
      - web

volumes:
  gongwen-data:
    name: ${GONGWEN_DATA_VOLUME:-gongwen-web-data}
  caddy-data:
    name: ${GONGWEN_CADDY_DATA_VOLUME:-gongwen-web-caddy-data}
  caddy-config:
    name: ${GONGWEN_CADDY_CONFIG_VOLUME:-gongwen-web-caddy-config}

networks:
  web:
    name: ${GONGWEN_NETWORK:-gongwen-web-network}
    ipam:
      config:
        - subnet: ${GONGWEN_NETWORK_SUBNET:-172.30.88.0/24}
